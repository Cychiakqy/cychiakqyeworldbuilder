<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>世界观编写器</title>
<style>
  :root{
    --bg:#fbfbf9; --panel:#ffffff; --line:#e8e8e3; --fg:#1b1b19; --sub:#9b9b93;
    --accent:#3d5a80; --danger:#b4483c;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--fg);font-size:14px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#e0e0da;border-radius:10px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  .app{
    display:flex;
    height:100vh;
    height:var(--app-height,100vh);
    height:100dvh;
    overflow:hidden;
  }

  .sidebar{
    width:236px;flex:0 0 236px;border-right:1px solid var(--line);
    background:var(--panel);display:flex;flex-direction:column;
  }
  .brand{padding:20px 18px 10px;font-size:14px;font-weight:600;letter-spacing:.01em}
  .brand small{display:block;font-weight:400;font-size:11px;color:var(--sub);letter-spacing:0}
  .world-list{flex:1;overflow-y:auto;padding:6px 10px 12px;-webkit-overflow-scrolling:touch}
  .sidebar-foot{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .sidebar-foot .row{display:flex;gap:6px}
  .sidebar-foot .row .btn-ghost{flex:1;text-align:center;padding:6px 4px;font-size:12px}
  .world-item{
    display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;
    border:none;background:none;border-radius:6px;cursor:pointer;font-size:13px;
    color:var(--fg);text-align:left;margin-bottom:1px;
  }
  .world-item:hover{background:#f4f4f0}
  .world-item.active{background:#eeeeea;font-weight:500}
  .world-item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .world-item-count{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
  .empty-small{padding:16px 10px;font-size:12px;color:var(--sub)}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .topbar{
    height:58px;flex:0 0 58px;display:flex;align-items:center;gap:10px;
    padding:0 28px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  .search-wrap{position:relative;flex:1;max-width:520px}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.35;pointer-events:none}
  .search-wrap input{
    width:100%;border:1px solid var(--line);border-radius:7px;
    padding:8px 12px 8px 34px;font-size:13px;font-family:inherit;
    background:var(--bg);color:var(--fg);outline:none;transition:.15s;
  }
  .search-wrap input:focus{border-color:#c9c9c2;background:#fff}

  .content{flex:1;overflow-y:auto;padding:30px 40px 90px;-webkit-overflow-scrolling:touch}
  .content > *{max-width:960px}
  .content > .panel.wide{max-width:none}

  .world-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
  .world-title{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
  .world-desc{color:var(--sub);font-size:13px;margin-top:4px;max-width:560px;white-space:pre-wrap}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
  .tab{
    background:none;border:none;border-bottom:2px solid transparent;
    padding:9px 16px;margin-bottom:-1px;font-size:13px;color:var(--sub);
    cursor:pointer;transition:color .15s;white-space:nowrap;
  }
  .tab:hover{color:var(--fg)}
  .tab.active{color:var(--fg);border-bottom-color:var(--fg)}
  .tab-num{font-size:11px;color:var(--sub);margin-left:4px}

  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .panel-hint{font-size:12px;color:var(--sub)}

  .card{
    border:1px solid var(--line);border-radius:8px;background:var(--panel);
    padding:14px 16px;margin-bottom:10px;transition:border-color .15s;
  }
  .card:hover{border-color:#dcdcd4}
  .card.clickable{cursor:pointer}
  .card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card-title{font-size:14px;font-weight:500}
  .card-text{margin-top:6px;font-size:13px;color:#4a4a45;white-space:pre-wrap;line-height:1.75}

  .tag{font-size:11px;padding:1px 7px;border-radius:4px;background:#f0f0ec;color:#6b6b63;white-space:nowrap}
  .tag.type{background:#eef1f5;color:var(--accent)}
  .tag.none{background:#f7f2f1;color:#a58a86}

  .link{background:none;border:none;padding:0 4px;font-size:12px;color:var(--sub);cursor:pointer}
  .link:hover{color:var(--fg)}
  .link.danger:hover{color:var(--danger)}
  .link:disabled{opacity:.22;cursor:default}

  .type-section{margin-bottom:26px}
  .type-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .type-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .type-name{font-size:13px;font-weight:600}
  .type-count{font-size:11px;color:var(--sub)}
  .entry-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;
  }
  .entry-card{
    position:relative;
    border:1px solid var(--line);border-radius:9px;background:var(--panel);
    overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s;
    display:flex;flex-direction:column;
  }
  .entry-card:hover{border-color:#d0d0c8;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .entry-card.pending-del,.tl-card.pending-del{border-color:#e3c4c0}
  .entry-del{
    position:absolute;top:6px;right:6px;z-index:3;
    width:24px;height:24px;border-radius:50%;padding:0;
    border:none;background:rgba(255,255,255,.94);
    color:var(--sub);font-size:15px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s,color .15s,background .15s;
    box-shadow:0 1px 5px rgba(0,0,0,.12);
  }
  .entry-card:hover .entry-del{opacity:1}
  .entry-del:hover{color:var(--danger);background:#fff}
  .entry-thumb{
    height:96px;background-size:cover;background-position:center;
    border-bottom:1px solid var(--line);
  }
  .entry-thumb-empty{
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:600;color:rgba(0,0,0,.18);
  }
  .entry-body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;gap:3px}
  .entry-title{font-size:13px;font-weight:500;line-height:1.45}
  .entry-meta{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry-excerpt{
    font-size:12px;color:#75756d;line-height:1.6;margin-top:2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .del-confirm{
    position:absolute;right:8px;bottom:8px;z-index:9;
    display:flex;flex-direction:column;gap:6px;
    background:rgba(255,255,255,.98);
    border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.16);
    max-width:calc(100% - 16px);
  }
  .del-confirm-text{font-size:11px;color:var(--sub);line-height:1.5;max-width:210px}
  .del-confirm-actions{display:flex;gap:6px;justify-content:flex-end}
  .del-confirm-actions button{
    font-size:12px;padding:4px 10px;border-radius:5px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--fg);
    font-family:inherit;white-space:nowrap;
  }
  .del-confirm-actions .del-no:hover{border-color:#c9c9c2}
  .del-confirm-actions .del-yes{
    background:var(--danger);border-color:var(--danger);color:#fff;
  }
  .del-confirm-actions .del-yes:hover{opacity:.88}

  .timeline-box{position:relative}
  .timeline-wrap{
    overflow-x:auto;overflow-y:hidden;padding:6px 0 12px;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
    scrollbar-width:auto;scrollbar-color:#cfcfc6 #f2f2ee;
  }
  .timeline-wrap::-webkit-scrollbar{height:16px}
  .timeline-wrap::-webkit-scrollbar-track{background:#f2f2ee;border-radius:8px;margin:0 4px}
  .timeline-wrap::-webkit-scrollbar-thumb{background:#cfcfc6;border-radius:8px;border:3px solid #f2f2ee;min-width:48px}
  .timeline-wrap::-webkit-scrollbar-thumb:hover{background:#b3b3a9}

  .tl-track{display:flex;align-items:flex-start;position:relative;width:max-content;min-height:150px;padding:0 44px 0 20px}
  .tl-line{position:absolute;left:0;right:0;top:43px;height:1px;background:var(--line);pointer-events:none}

  .tl-insert{
    flex:0 0 auto;width:30px;display:flex;flex-direction:column;align-items:center;
    padding:34px 0 0;border:none;background:none;cursor:pointer;opacity:0;transition:opacity .15s;
  }
  .tl-track:hover .tl-insert{opacity:1}
  .tl-insert span{
    width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;color:var(--sub);transition:.15s;
  }
  .tl-insert:hover span{border-color:#bdbdb5;color:var(--fg);background:#fff}

  .tl-group{flex:0 0 auto;width:238px;display:flex;flex-direction:column;align-items:center}
  .tl-label{width:100%;height:38px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
  .tl-label span{
    font-size:11px;color:var(--accent);line-height:1.3;text-align:center;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    max-height:2.6em;word-break:break-word;
  }
  .tl-dot{width:11px;height:11px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 5px var(--bg);flex:0 0 auto}
  .tl-cards{width:100%;margin-top:14px;display:flex;flex-direction:column;align-items:stretch}
  .tl-card{
    position:relative;
    width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);
    padding:10px 12px;transition:border-color .15s;
  }
  .tl-group:hover .tl-card{border-color:#d8d8d0}
  .tl-card-title{font-size:13px;font-weight:500;line-height:1.45}
  .tl-card-text{
    margin-top:4px;font-size:12px;color:#75756d;line-height:1.65;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tl-story-list{margin-top:8px;padding-top:7px;border-top:1px dashed #f1f1ec;display:flex;flex-direction:column;gap:2px}
  .tl-story{
    display:flex;align-items:center;gap:5px;width:100%;text-align:left;background:none;border:none;
    padding:3px 6px;margin:0;font-size:12px;color:#7b5ea7;cursor:pointer;border-radius:4px;transition:background .15s;
  }
  .tl-story:hover{background:#f7f3fa}
  .tl-story-dot{width:4px;height:4px;border-radius:50%;background:#cbbfe0;flex:0 0 auto}
  .tl-story-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .tl-card-actions{
    display:flex;align-items:center;gap:2px;margin-top:8px;padding-top:7px;
    border-top:1px solid #f3f3ef;opacity:0;transition:opacity .15s;
  }
  .tl-group:hover .tl-card-actions{opacity:1}
  .tl-card-actions .link{font-size:11px}
  .spacer{flex:1}

  .tl-card-insert{
    width:100%;height:22px;border:none;background:none;cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;
  }
  .tl-group:hover .tl-card-insert{opacity:.55}
  .tl-card-insert:hover{opacity:1 !important}
  .tl-card-insert span{
    width:16px;height:16px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
    color:var(--sub);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .tl-card-insert:hover span{border-color:#bdbdb5;color:var(--fg)}

  .tl-scroll-btn{
    position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;
    border:1px solid var(--line);background:rgba(255,255,255,.96);color:var(--sub);cursor:pointer;z-index:6;
    display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;padding:0 0 2px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);opacity:0;transition:opacity .15s,color .15s,border-color .15s;
  }
  .timeline-box:hover .tl-scroll-btn{opacity:1}
  .tl-scroll-btn:hover{color:var(--fg);border-color:#c9c9c2}
  .tl-scroll-btn:disabled{opacity:0 !important;pointer-events:none}
  .tl-scroll-btn.left{left:2px}
  .tl-scroll-btn.right{right:2px}

  .graph-wrap{
    border:1px solid var(--line);border-radius:10px;background:var(--panel);
    overflow:hidden;margin-top:4px;
  }
  .graph-svg{width:100%;height:auto;display:block;user-select:none;touch-action:none}
  .graph-edge-group .graph-edge-line{stroke:#d5d5cc;stroke-width:1.5;fill:none;transition:stroke .15s,stroke-width .15s}
  .graph-edge-group .graph-edge-arrow{fill:#d5d5cc;transition:fill .15s}
  .graph-edge-group .graph-edge-label{
    font-size:10.5px;fill:#9b9b93;text-anchor:middle;
    paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round;
    pointer-events:none;transition:fill .15s;
  }
  .graph-edge-group.highlight .graph-edge-line{stroke:#8a6d3b;stroke-width:2.5}
  .graph-edge-group.highlight .graph-edge-arrow{fill:#8a6d3b}
  .graph-edge-group.highlight .graph-edge-label{fill:#8a6d3b;font-weight:600}
  .graph-node{cursor:grab}
  .graph-node:active{cursor:grabbing}
  .graph-node circle{fill:#f7f1e6;stroke:#8a6d3b;stroke-width:1.5;transition:fill .15s}
  .graph-node:hover circle{fill:#f0e3cc}
  .graph-node-initial{font-size:15px;fill:#8a6d3b;text-anchor:middle;font-weight:600;pointer-events:none}
  .graph-node-label{font-size:10.5px;fill:var(--fg);text-anchor:middle;pointer-events:none}

  .graph-legend{
    margin-top:14px;padding:10px 14px;
    border:1px solid var(--line);border-radius:8px;background:var(--panel);
    font-size:12px;color:var(--sub);
    display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
  }
  .graph-legend-title{font-weight:600;color:var(--fg)}
  .graph-legend-item{padding:2px 8px;background:#f7f1e6;color:#8a6d3b;border-radius:4px}

  .btn-primary{
    background:var(--fg);color:#fff;border:none;border-radius:6px;
    padding:7px 14px;font-size:13px;cursor:pointer;transition:opacity .15s;white-space:nowrap;
  }
  .btn-primary:hover{opacity:.82}
  .btn-primary.full{width:100%;padding:8px 14px}
  .btn-ghost{
    background:none;border:1px solid var(--line);border-radius:6px;
    padding:6px 12px;font-size:13px;cursor:pointer;color:var(--fg);
    transition:border-color .15s,color .15s;white-space:nowrap;
  }
  .btn-ghost:hover{border-color:#c9c9c2}
  .btn-ghost.danger:hover{border-color:#e3c4c0;color:var(--danger)}
  .btn-ghost.full-width{width:100%;text-align:center}

  .empty{border:1px dashed var(--line);border-radius:8px;padding:38px 20px;text-align:center;color:var(--sub);font-size:13px}
  .empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    height:62vh;color:var(--sub);text-align:center;
  }
  .empty-state h2{font-size:16px;font-weight:500;color:var(--fg)}

  .overlay{
    position:fixed;inset:0;background:rgba(25,25,22,.28);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
    overflow-y:auto;
  }
  .modal{
    background:var(--panel);border-radius:10px;width:100%;max-width:540px;
    padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.14);
    max-height:calc(var(--app-height,100vh) - 40px);overflow-y:auto;
    animation:pop .16s ease;
  }
  .modal.modal-wide{max-width:920px}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
  .modal-title{font-size:15px;font-weight:600;margin-bottom:18px}
  .field{display:block;margin-bottom:14px}
  .field-label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
  .field-hint{display:block;font-size:11px;color:var(--sub);margin-top:4px}
  .field input,.field textarea,.field select{
    width:100%;border:1px solid var(--line);border-radius:6px;
    padding:8px 11px;font-size:13px;font-family:inherit;color:var(--fg);
    background:var(--bg);outline:none;resize:vertical;transition:.15s;
  }
  .field select{padding:8px 9px}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:#c9c9c2;background:#fff}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

  .editor-body{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
  .editor-rel{border-left:1px solid var(--line);padding-left:20px;min-height:160px}
  .rel-title{font-size:13px;font-weight:600;margin-bottom:10px}
  .rel-empty{font-size:12px;color:var(--sub);padding:6px 0 10px}
  .rel-group{margin-bottom:10px}
  .rel-group-head{
    font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;
    letter-spacing:.03em;margin-bottom:5px;
  }
  .rel-item{
    display:flex;align-items:center;gap:4px;padding:5px 8px;border-radius:5px;
    background:#f7f7f3;font-size:12px;margin-bottom:4px;
  }
  .rel-label{color:var(--accent);flex:0 0 auto}
  .rel-target{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rel-del{background:none;border:none;color:var(--sub);cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
  .rel-del:hover{color:var(--danger)}
  .rel-add{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .rel-add input,.rel-add select{
    width:100%;border:1px solid var(--line);border-radius:6px;
    padding:6px 9px;font-size:12px;font-family:inherit;background:var(--bg);outline:none;
  }
  .rel-add input:focus,.rel-add select:focus{border-color:#c9c9c2;background:#fff}
  .rel-add-actions{display:flex;gap:6px;justify-content:flex-end}
  .rel-help{font-size:11px;color:var(--sub);margin:8px 0 12px;line-height:1.6}

  .img-upload{display:flex;flex-direction:column;gap:8px}
  .img-preview{
    width:100%;max-height:160px;object-fit:cover;border-radius:6px;
    border:1px solid var(--line);display:none;
  }
  .img-preview.show{display:block}
  .img-actions{display:flex;gap:8px}
  .img-actions label,.img-actions button{
    font-size:12px;padding:5px 10px;border-radius:5px;cursor:pointer;
    border:1px solid var(--line);background:var(--bg);color:var(--fg);
  }
  .img-actions label:hover,.img-actions button:hover{border-color:#c9c9c2}
  .img-actions input[type=file]{display:none}

  .boot-error{
    position:fixed;inset:0;z-index:9999;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px;
    text-align:center;color:var(--fg);font-size:14px;line-height:1.7;
  }
  .boot-error h2{font-size:16px;margin-bottom:10px}
  .boot-error p{color:var(--sub);font-size:13px;margin-bottom:6px}
  .boot-error code{
    display:inline-block;background:#f3f3ef;padding:2px 6px;border-radius:4px;
    font-size:12px;color:#b4483c;margin-top:8px;word-break:break-all;text-align:left;
  }

  @media (max-width:760px){
    .app{flex-direction:column}
    .sidebar{width:100%;flex:0 0 auto;max-height:200px;border-right:none;border-bottom:1px solid var(--line)}
    .world-list{max-height:110px}
    .topbar{padding:0 14px;height:54px;flex:0 0 54px}
    .topbar .btn-ghost{padding:5px 8px;font-size:12px}
    .content{padding:18px 14px 70px}
    .tl-group{width:200px}
    .tl-card-actions{opacity:1}

    </div>

  <main class="main" id="main"></main>
</div>

<script>
/* =========================================================
   启动守卫
   ========================================================= */
(function () {
  var shown = false;
  window.__wbShowError = function (msg) {
    if (shown) return;
    shown = true;
    try {
      var div = document.createElement('div');
      div.className = 'boot-error';
      div.innerHTML = '<div><h2>页面加载遇到问题</h2>' +
        '<code>' + String(msg).replace(/[<>&]/g, function (c) {
          return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
        }) + '</code></div>';
      document.body.appendChild(div);
    } catch (e) {}
  };
  window.onerror = function (msg, src, line) {
    window.__wbShowError(msg + ' (第 ' + line + ' 行)');
    return false;
  };
})();

/* =========================================================
   运行环境与工具
   ========================================================= */
var ELECTRON = !!(window.wbStore && window.wbStore.isElectron);
var STORAGE_KEY = 'worldbuilder.v2';

var COLLATOR = (function () {
  try { return new Intl.Collator('zh-Hans-CN', { numeric: true, sensitivity: 'base' }); }
  catch (e) { return { compare: function (a, b) { return String(a).localeCompare(String(b)); } }; }
})();

var BUILTIN_TYPES = [
  { id: 'setting',  name: '设定' },
  { id: 'event',    name: '事件' },
  { id: 'story',    name: '故事' },
  { id: 'character',name: '人物' },
  { id: 'item',     name: '物品' },
  { id: 'symPair',  name: '对称关联', special: 'symPair' }
];

var TYPE_COLORS = {
  setting:'#6b6b63', event:'#3f7a5e', story:'#7b5ea7',
  character:'#8a6d3b', item:'#3d5a80', symPair:'#b4483c'
};
var TYPE_COLORS_LIGHT = {
  setting:'#f0f0ec', event:'#eef4f0', story:'#f3eef5',
  character:'#f7f1e6', item:'#eaf4ee', symPair:'#f7eeed'
};

function $(s) { return document.querySelector(s); }
function uid() {
  return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtNum(n) { return String(Math.round(n * 1000) / 1000); }
function typeColor(id) { return TYPE_COLORS[id] || '#8a8a82'; }
function typeColorLight(id) { return TYPE_COLORS_LIGHT[id] || '#f2f2ee'; }

/* =========================================================
   视口高度
   ========================================================= */
(function () {
  function setAppHeight() {
    document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 300); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
})();

/* =========================================================
   数据存储
   ========================================================= */
var DataStore = {
  load: function () {
    if (ELECTRON) {
      try { return window.wbStore.loadData(); } catch (e) { return null; }
    }
    try {
      return window.localStorage.getItem(STORAGE_KEY) ||
             window.localStorage.getItem('worldbuilder.v1');
    } catch (e) { return null; }
  },
  save: function (str) {
    if (ELECTRON) {
      var res = window.wbStore.saveData(str);
      if (!res.ok) setTimeout(function () { alert('保存失败：' + res.error); }, 0);
      return;
    }
    try { window.localStorage.setItem(STORAGE_KEY, str); }
    catch (e) {
      setTimeout(function () { alert('保存失败：浏览器本地存储空间不足。'); }, 0);
    }
  }
};

function resolveImage(value) {
  if (!value) return '';
  if (ELECTRON && value.indexOf('data:') !== 0) {
    try { return window.wbStore.resolveImage(value); } catch (e) { return ''; }
  }
  return value;
}

function saveImageToStore(dataUrl) {
  return new Promise(function (resolve, reject) {
    if (ELECTRON) {
      var res = window.wbStore.saveImage(dataUrl);
      if (res.ok) resolve(res.path);
      else reject(new Error(res.error || '保存图片失败'));
    } else {
      resolve(dataUrl);
    }
  });
}

function deleteImageFromStore(value) {
  if (!ELECTRON || !value || value.indexOf('data:') === 0) return;
  try { window.wbStore.deleteImage(value); } catch (e) {}
}

/* =========================================================
   状态
   ========================================================= */
var state = {
  worlds: [],
  activeWorldId: null,
  activeTab: 'entries',
  search: ''
};

var graphDrag = null;
var graphData = null;

function currentWorld() {
  return state.worlds.find(function (w) { return w.id === state.activeWorldId; }) || null;
}

function save() {
  DataStore.save(JSON.stringify({
    worlds: state.worlds,
    activeWorldId: state.activeWorldId
  }));
}

/* =========================================================
   世界与类型
   ========================================================= */
function makeWorld(name, desc) {
  return {
    id: uid(), name: name || '新世界', desc: desc || '',
    entryTypes: BUILTIN_TYPES.map(function (t) { return Object.assign({}, t); }),
    entries: []
  };
}

function typeById(w, typeId) {
  return w.entryTypes.find(function (t) { return t.id === typeId; }) || { id: typeId, name: typeId };
}

function getSymPairs(w) {
  var symType = w.entryTypes.find(function (t) { return t.special === 'symPair'; });
  if (!symType) return [];
  return w.entries
    .filter(function (e) { return e.typeId === symType.id; })
    .filter(function (e) { return e.symA && e.symB; })
    .map(function (e) {
      return { id: e.id, a: e.symA, b: e.symB, mutualName: e.mutualName || '' };
    });
}

function findEntry(w, id) {
  return w.entries.find(function (e) { return e.id === id; }) || null;
}

/* =========================================================
   迁移与加载
   ========================================================= */
function migrateWorld(w) {
  if (Array.isArray(w.entries) && Array.isArray(w.entryTypes)) {
    BUILTIN_TYPES.forEach(function (bt) {
      if (!w.entryTypes.some(function (t) { return t.id === bt.id; })) {
        w.entryTypes.push(Object.assign({}, bt));
      }
    });
    w.entries.forEach(function (e) {
      e.relations = e.relations || [];
      if (typeof e.mutualName !== 'string') e.mutualName = '';
    });
    return;
  }

  var entries = [];
  (w.settings || []).forEach(function (s) {
    entries.push({
      id: s.id || uid(), typeId: 'setting', title: s.title || '', content: s.content || '',
      category: s.category || '', image: s.image || null, relations: s.relations || []
    });
  });
  (w.events || []).forEach(function (e) {
    entries.push({
      id: e.id || uid(), typeId: 'event', title: e.title || '', content: e.content || '',
      absTime: e.absTime, timeName: e.timeName || e.time || '', order: e.order || 0,
      image: e.image || null, relations: e.relations || []
    });
  });
  (w.stories || []).forEach(function (s) {
    entries.push({
      id: s.id || uid(), typeId: 'story', title: s.title || '', content: s.content || '',
      eventId: s.eventId || null, image: s.image || null, relations: s.relations || []
    });
  });
  (w.characters || []).forEach(function (c) {
    entries.push({
      id: c.id || uid(), typeId: 'character', title: c.title || '', content: c.content || '',
      image: c.image || null, relations: c.relations || []
    });
  });
  (w.items || []).forEach(function (i) {
    entries.push({
      id: i.id || uid(), typeId: 'item', title: i.title || '', content: i.content || '',
      image: i.image || null, relations: i.relations || []
    });
  });
  (w.symPairs || []).forEach(function (p) {
    entries.push({
      id: p.id || uid(), typeId: 'symPair',
      title: (p.a || '') + ' ↔ ' + (p.b || ''),
      symA: p.a || '', symB: p.b || '',
      mutualName: p.mutualName || '',
      content: '', image: null, relations: []
    });
  });

  w.entries = entries;
  w.entryTypes = BUILTIN_TYPES.map(function (t) { return Object.assign({}, t); });
  delete w.settings; delete w.events; delete w.stories;
  delete w.characters; delete w.items; delete w.symPairs;
}

function load() {
  try {
    var raw = DataStore.load();
    if (!raw && ELECTRON) {
      try { raw = window.localStorage.getItem(STORAGE_KEY); } catch (e) {}
      if (raw) { try { DataStore.save(raw); } catch (e) {} }
    }
    if (raw) {
      var d = JSON.parse(raw);
      state.worlds = Array.isArray(d.worlds) ? d.worlds : [];
      state.activeWorldId = d.activeWorldId || null;
    }
  } catch (err) {
    console.warn('数据解析失败', err);
    state.worlds = [];
  }

  if (!Array.isArray(state.worlds)) state.worlds = [];

  state.worlds.forEach(function (w) {
    try { migrateWorld(w); } catch (e) { console.warn(e); }
  });

  if (!state.worlds.some(function (w) { return w.id === state.activeWorldId; })) {
    state.activeWorldId = state.worlds[0] ? state.worlds[0].id : null;
  }

  if (!state.worlds.length) {
    var w = seedWorld();
    state.worlds = [w];
    state.activeWorldId = w.id;
    save();
  }
}

/* =========================================================
   种子数据

function seedWorld() {

/* =========================================================
   事件排序
   ========================================================= */
function normalizeEventOrders(w) {
  var events = w.entries.filter(function (e) { return e.typeId === 'event'; });
  if (!events.length) return;

  var needsAbs = events.some(function (e) {
    return typeof e.absTime !== 'number' || !Number.isFinite(e.absTime);
  });
  if (needsAbs) {
    var ordered = events.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    ordered.forEach(function (e, i) {
      if (typeof e.absTime !== 'number' || !Number.isFinite(e.absTime)) e.absTime = i;
    });
  }

  var groups = new Map();
  events.forEach(function (e) {
    if (!groups.has(e.absTime)) groups.set(e.absTime, []);
    groups.get(e.absTime).push(e);
  });
  groups.forEach(function (list) {
    list.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    list.forEach(function (e, i) { e.order = i; });
  });
}

function sortedEvents(w) {
  return w.entries.filter(function (e) { return e.typeId === 'event'; }).sort(function (a, b) {
    if (a.absTime !== b.absTime) return a.absTime - b.absTime;
    return (a.order || 0) - (b.order || 0);
  });
}

function groupEvents(w) {
  var list = sortedEvents(w);
  var groups = [];
  var cur = null;
  list.forEach(function (e) {
    if (!cur || cur.abs !== e.absTime) {
      cur = { abs: e.absTime, events: [] };
      groups.push(cur);
    }
    cur.events.push(e);
  });
  return groups;
}

function groupLabel(g) {
  var names = [];
  g.events.forEach(function (e) {
    if (e.timeName && names.indexOf(e.timeName) < 0) names.push(e.timeName);
  });
  return names.length ? names.join(' / ') : fmtNum(g.abs);
}

function suggestNextAbs(w) {
  var evs = w.entries.filter(function (e) { return e.typeId === 'event'; });
  if (!evs.length) return '1';
  return fmtNum(Math.max.apply(null, evs.map(function (e) { return e.absTime; })) + 1);
}

function suggestBetween(a, b) {
  if (!Number.isFinite(a)) return fmtNum(b - 1);
  return fmtNum((a + b) / 2);
}

/* =========================================================
   关联逻辑
   ========================================================= */
function addRelation(w, sourceEntry, label, targetId, relId) {
  if (!sourceEntry || !label || !targetId) return;
  sourceEntry.relations = sourceEntry.relations || [];
  if (!sourceEntry.relations.some(function (r) { return r.label === label && r.targetId === targetId; })) {
    sourceEntry.relations.push({ id: relId || uid(), label: label, targetId: targetId });
  }
  if (targetId === sourceEntry.id) return;

  var pairs = getSymPairs(w);
  var pair = pairs.find(function (p) { return p.a === label || p.b === label; });
  if (!pair) return;

  var reverseLabel = pair.a === label ? pair.b : pair.a;
  var target = findEntry(w, targetId);
  if (!target) return;
  target.relations = target.relations || [];
  if (!target.relations.some(function (r) { return r.label === reverseLabel && r.targetId === sourceEntry.id; })) {
    target.relations.push({ id: uid(), label: reverseLabel, targetId: sourceEntry.id });
  }
}

function removeRelation(w, sourceEntry, relId) {
  if (!sourceEntry || !sourceEntry.relations) return;
  var rel = sourceEntry.relations.find(function (r) { return r.id === relId; });
  if (!rel) return;

  sourceEntry.relations = sourceEntry.relations.filter(function (r) { return r.id !== relId; });

  var pairs = getSymPairs(w);
  var pair = pairs.find(function (p) { return p.a === rel.label || p.b === rel.label; });
  if (!pair) return;

  var reverseLabel = pair.a === rel.label ? pair.b : pair.a;
  var target = findEntry(w, rel.targetId);
  if (!target) return;
  target.relations = (target.relations || []).filter(function (r) {
    return !(r.label === reverseLabel && r.targetId === sourceEntry.id);
  });
}

function applyRelations(w, sourceEntry, oldRels, newRels) {
  var newIds = new Set(newRels.map(function (r) { return r.id; }));
  oldRels.forEach(function (r) {
    if (!newIds.has(r.id)) removeRelation(w, sourceEntry, r.id);
  });
  var oldIds = new Set(oldRels.map(function (r) { return r.id; }));
  newRels.forEach(function (r) {
    if (!oldIds.has(r.id)) addRelation(w, sourceEntry, r.label, r.targetId, r.id);
  });
}

function cleanupRelations(w, deletedId) {
  w.entries.forEach(function (e) {
    if (e.relations) e.relations = e.relations.filter(function (r) { return r.targetId !== deletedId; });
  });
}

/* =========================================================
   渲染
   ========================================================= */
function render() {
  renderSidebar();
  renderMain();
}

function renderKeepScroll() {
  var prev = document.querySelector('.timeline-wrap');
  var sl = prev ? prev.scrollLeft : 0;
  render();
  var next = document.querySelector('.timeline-wrap');
  if (next) next.scrollLeft = sl;
  requestAnimationFrame(function () {
    updateScrollBtns();
    initGraphInteraction();
  });
}

function renderSidebar() {
  var list = $('#worldList');
  if (!state.worlds.length) {
    list.innerHTML = '<div class="empty-small">暂无世界</div>';
    return;
  }
  list.innerHTML = state.worlds.map(function (w) {
    return '<button class="world-item ' + (w.id === state.activeWorldId ? 'active' : '') + '" data-world="' + w.id + '">' +
      '<span class="world-item-name">' + esc(w.name) + '</span>' +
      '<span class="world-item-count">' + w.entries.length + '</span>' +
    '</button>';
  }).join('');
}

function renderMain() {
  graphDrag = null;
  graphData = null;
  var main = $('#main');
  var w = currentWorld();
  var searching = state.search.trim() !== '';

  main.innerHTML =
    '<div class="topbar">' +
      '<div class="search-wrap">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>' +
        '<input id="searchInput" type="text" autocomplete="off" ' +
          'placeholder="' + (w ? '搜索所有条目…' : '先创建一个世界') + '" ' +
          'value="' + esc(state.search) + '" ' + (w ? '' : 'disabled') + '>' +
      '</div>' +
      (w ? '<button class="btn-ghost" data-act="editworld">编辑世界</button>' +
           '<button class="btn-ghost danger" data-act="delworld">删除世界</button>' : '') +
    '</div>' +
    '<div class="content" id="contentArea">' +
      (w ? renderWorld(w, searching) : renderNoWorld()) +
    '</div>';

  requestAnimationFrame(function () {
    updateScrollBtns();
    initGraphInteraction();
  });
}

function updateContentOnly() {
  var area = document.getElementById('contentArea');
  if (!area) return;
  var w = currentWorld();
  var searching = state.search.trim() !== '';
  area.innerHTML = w ? renderWorld(w, searching) : renderNoWorld();
  requestAnimationFrame(function () {
    updateScrollBtns();
    initGraphInteraction();
  });
}

function renderNoWorld() {
  return '<div class="empty-state">' +
    '<h2>还没有任何世界</h2>' +
    '<p>在左侧新建一个世界，开始编写它的条目和时间线。</p>' +
    '<button class="btn-primary" data-act="newworld">新建世界</button>' +
  '</div>';
}

function renderWorld(w, searching) {
  var head = '<div class="world-head"><div>' +
    '<h1 class="world-title">' + esc(w.name) + '</h1>' +
    '<p class="world-desc">' + (w.desc ? esc(w.desc) : '暂无简介') + '</p>' +
  '</div></div>';

  if (searching) return head + renderSearch(w);

  var evCount = w.entries.filter(function (e) { return e.typeId === 'event'; }).length;
  var charCount = w.entries.filter(function (e) { return e.typeId === 'character'; }).length;

  return head +
    '<nav class="tabs">' +
      '<button class="tab ' + (state.activeTab === 'entries' ? 'active' : '') + '" data-act="tab" data-tab="entries">条目<span class="tab-num">' + w.entries.length + '</span></button>' +
      '<button class="tab ' + (state.activeTab === 'timeline' ? 'active' : '') + '" data-act="tab" data-tab="timeline">时间线<span class="tab-num">' + evCount + '</span></button>' +
      '<button class="tab ' + (state.activeTab === 'graph' ? 'active' : '') + '" data-act="tab" data-tab="graph">关系图<span class="tab-num">' + charCount + '</span></button>' +
    '</nav>' +
    '<div class="panel ' + (state.activeTab === 'timeline' ? 'wide' : '') + '">' + renderPanel(w) + '</div>';
}

function renderPanel(w) {
  if (state.activeTab === 'timeline') return renderTimeline(w);
  if (state.activeTab === 'graph') return renderGraph(w);
  return renderEntriesPage(w);
}

/* ---------- 条目页 ---------- */
function renderEntriesPage(w) {
  normalizeEventOrders(w);

  var groups = new Map();
  w.entries.forEach(function (e) {
    if (!groups.has(e.typeId)) groups.set(e.typeId, []);
    groups.get(e.typeId).push(e);
  });

  var html = '<div class="panel-head">' +
    '<span class="panel-hint">' + w.entries.length + ' 个条目 · ' + w.entryTypes.length + ' 种类型</span>' +
    '<button class="btn-primary" data-act="new-entry">+ 新建条目</button>' +
  '</div>';

  w.entryTypes.forEach(function (t) {
    var list = groups.get(t.id) || [];
    if (!list.length) return;
    html += renderTypeSection(w, t, list);
  });

  if (!w.entries.length) {
    html += '<div class="empty">还没有任何条目。点击右上角新建。</div>';
  }

  return html;
}

function renderTypeSection(w, type, list) {
  return '<div class="type-section">' +
    '<div class="type-head">' +
      '<span class="type-dot" style="background:' + typeColor(type.id) + '"></span>' +
      '<span class="type-name">' + esc(type.name) + '</span>' +
      '<span class="type-count">' + list.length + '</span>' +
    '</div>' +
    '<div class="entry-grid">' + list.map(function (e) { return renderEntryCard(w, e, type); }).join('') + '</div>' +
  '</div>';
}

function renderEntryCard(w, e, type) {
  var meta = '';
  if (type.id === 'event') meta = e.timeName || fmtNum(e.absTime);
  else if (type.id === 'setting') meta = e.category || '';
  else if (type.id === 'story') {
    var ev = e.eventId ? findEntry(w, e.eventId) : null;
    meta = ev ? ev.title : '未关联事件';
  } else if (type.special === 'symPair') {
    meta = (e.symA || '?') + ' ↔ ' + (e.symB || '?') + (e.mutualName ? '（' + e.mutualName + '）' : '');
  }

  var relCount = (e.relations || []).length;
  var metaParts = [];
  if (meta) metaParts.push(esc(meta));
  if (relCount) metaParts.push(relCount + ' 关联');

  var thumb;
  if (e.image) {
    thumb = '<div class="entry-thumb" style="background-image:url(\'' + esc(resolveImage(e.image)) + '\')"></div>';
  } else {
    thumb = '<div class="entry-thumb entry-thumb-empty" style="background:' + typeColorLight(type.id) + '"><span>' + esc(type.name.charAt(0) || '?') + '</span></div>';
  }

  return '<div class="entry-card" data-act="open-entry" data-id="' + e.id + '">' +
    '<button type="button" class="entry-del" data-act="del-entry" data-id="' + e.id + '" title="删除">×</button>' +
    thumb +
    '<div class="entry-body">' +
      '<div class="entry-title">' + esc(e.title || '未命名') + '</div>' +
      '<div class="entry-meta">' + metaParts.join(' · ') + '</div>' +
      (e.content ? '<div class="entry-excerpt">' + esc(e.content.slice(0, 90)) + '</div>' : '') +
    '</div>' +
  '</div>';
}

/* ---------- 时间线 ---------- */
function renderTimeline(w) {
  normalizeEventOrders(w);
  var groups = groupEvents(w);

  var storiesByEvent = new Map();
  w.entries.filter(function (e) { return e.typeId === 'story' && e.eventId; }).forEach(function (s) {
    if (!storiesByEvent.has(s.eventId)) storiesByEvent.set(s.eventId, []);
    storiesByEvent.get(s.eventId).push(s);
  });

  var evCount = w.entries.filter(function (e) { return e.typeId === 'event'; }).length;
  var linkedCount = w.entries.filter(function (e) {
    return e.typeId === 'story' && e.eventId && findEntry(w, e.eventId);
  }).length;

  var head = '<div class="panel-head">' +
    '<span class="panel-hint">' + evCount + ' 个事件 · ' + groups.length + ' 个时间点 · ' + linkedCount + ' 篇故事挂在事件上</span>' +
    '<button class="btn-primary" data-act="new-event" data-abs="' + suggestNextAbs(w) + '">+ 新建事件</button>' +
  '</div>';

  if (!groups.length) {
    return head + '<div class="empty">时间线还是空的。点击「新建事件」或时间线上的 + 添加第一个事件。</div>';
  }

  var inner = '';
  groups.forEach(function (g, gi) {
    var prevAbs = gi > 0 ? groups[gi - 1].abs : null;
    var sug = gi === 0 ? fmtNum(g.abs - 1) : suggestBetween(prevAbs, g.abs);
    inner += '<button class="tl-insert" data-act="new-event" data-abs="' + sug + '" title="在此插入新的时间点"><span>+</span></button>';

    var label = groupLabel(g);
    inner += '<div class="tl-group">' +
      '<div class="tl-label" title="' + esc(label) + '"><span>' + esc(label) + '</span></div>' +
      '<span class="tl-dot"></span>' +
      '<div class="tl-cards">' +
        g.events.map(function (e, i) {
          return renderEventCard(w, e, i, g.events.length, g, storiesByEvent);
        }).join('') +
      '</div>' +
    '</div>';
  });

  var lastAbs = groups[groups.length - 1].abs;
  inner += '<button class="tl-insert" data-act="new-event" data-abs="' + fmtNum(lastAbs + 1) + '" title="在末尾添加新的时间点"><span>+</span></button>';

  return head +
    '<div class="timeline-box">' +
      '<button class="tl-scroll-btn left" data-act="scroll" data-dir="-1" title="向左滚动">‹</button>' +
      '<div class="timeline-wrap"><div class="tl-track">' +
        '<div class="tl-line"></div>' + inner +
      '</div></div>' +
      '<button class="tl-scroll-btn right" data-act="scroll" data-dir="1" title="向右滚动">›</button>' +
    '</div>';
}

function renderEventCard(w, e, i, total, g, storiesByEvent) {
  var abs = fmtNum(g.abs);
  var name = esc(g.events[0].timeName || '');
  var relStories = storiesByEvent.get(e.id) || [];

  return '<div class="tl-card" data-eid="' + e.id + '">' +
    '<div class="tl-card-title">' + esc(e.title) + '</div>' +
    (e.content ? '<div class="tl-card-text">' + esc(e.content) + '</div>' : '') +
    (relStories.length
      ? '<div class="tl-story-list">' + relStories.map(function (s) {
          return '<button class="tl-story" data-act="open-entry" data-id="' + s.id + '" title="' + esc(s.title) + '">' +
            '<span class="tl-story-dot"></span><span class="tl-story-name">' + esc(s.title) + '</span>' +
          '</button>';
        }).join('') + '</div>'
      : '') +
    '<div class="tl-card-actions">' +
      '<button class="link" data-act="open-entry" data-id="' + e.id + '">编辑</button>' +
      '<button class="link danger" data-act="del-entry" data-id="' + e.id + '">删除</button>' +
      '<button class="link" data-act="new-story" data-event="' + e.id + '" title="为这个事件添加故事">+故事</button>' +
      '<span class="spacer"></span>' +
      '<button class="link" data-act="up-event" data-id="' + e.id + '" title="同一时间点内上移" ' + (i === 0 ? 'disabled' : '') + '>↑</button>' +
      '<button class="link" data-act="down-event" data-id="' + e.id + '" title="同一时间点内下移" ' + (i === total - 1 ? 'disabled' : '') + '>↓</button>' +
    '</div>' +
  '</div>' +
  '<button class="tl-card-insert" data-act="new-same" data-abs="' + abs + '" data-name="' + name + '" data-after="' + e.id + '" title="在此事件下方，添加同一时间点的事件"><span>+</span></button>';
}

/* ---------- 关系图 ---------- */
function renderGraph(w) {
  var characters = w.entries.filter(function (e) { return e.typeId === 'character'; });

  if (characters.length === 0) {
    return '<div class="panel-head">' +
      '<span class="panel-hint">还没有人物条目</span>' +
      '<button class="btn-primary" data-act="new-entry" data-type="character">+ 新建人物</button>' +
    '</div>' +
    '<div class="empty">添加人物条目后，这里会显示人物之间的关联关系。</div>';
  }

  var charIds = new Set(characters.map(function (c) { return c.id; }));

  var directedMap = new Map();
  characters.forEach(function (c) {
    (c.relations || []).forEach(function (r) {
      if (!charIds.has(r.targetId)) return;
      if (r.targetId === c.id) return;
      var key = c.id + '->' + r.targetId;
      if (!directedMap.has(key)) directedMap.set(key, []);
      if (!directedMap.get(key).some(function (x) { return x.label === r.label; })) {
        directedMap.get(key).push({ label: r.label });
      }
    });
  });

  var symMap = new Map();
  w.entries.forEach(function (e) {
    if (e.typeId === 'symPair' && e.symA && e.symB) {
      var mutual = e.mutualName || '';
      symMap.set(e.symA, { reverse: e.symB, mutualName: mutual });
      symMap.set(e.symB, { reverse: e.symA, mutualName: mutual });
    }
  });

  var pairSet = new Set();
  directedMap.forEach(function (_, key) {
    var parts = key.split('->');
    var a = parts[0], b = parts[1];
    pairSet.add(a < b ? a + '|' + b : b + '|' + a);
  });

  var graphEdges = [];
  pairSet.forEach(function (pairKey) {
    var parts = pairKey.split('|');
    var a = parts[0], b = parts[1];
    var forward = (directedMap.get(a + '->' + b) || []).slice();
    var backward = (directedMap.get(b + '->' + a) || []).slice();

    var fUsed = new Array(forward.length).fill(false);
    var bUsed = new Array(backward.length).fill(false);
    var pairEdges = [];

    forward.forEach(function (f, fi) {
      var info = symMap.get(f.label);
      if (!info) return;
      var bi = -1;
      for (var i = 0; i < backward.length; i++) {
        if (!bUsed[i] && backward[i].label === info.reverse) { bi = i; break; }
      }
      if (bi >= 0) {
        fUsed[fi] = true;
        bUsed[bi] = true;
        var label = info.mutualName || (f.label + ' / ' + info.reverse);
        pairEdges.push({ type: 'bidirectional', source: a, target: b, labels: [label] });
      }
    });

    forward.forEach(function (f, fi) {
      if (fUsed[fi]) return;
      pairEdges.push({ type: 'oneway', source: a, target: b, labels: [f.label] });
    });

    backward.forEach(function (bk, bi) {
      if (bUsed[bi]) return;
      pairEdges.push({ type: 'oneway', source: b, target: a, labels: [bk.label] });
    });

    pairEdges.forEach(function (pe, i) {
      pe.offsetIndex = i;
      pe.pairTotal = pairEdges.length;
      pe.pairKey = pairKey;
      graphEdges.push(pe);
    });
  });

  var W = 960, H = 620;
  var cx = W / 2, cy = H / 2;
  var n = characters.length;
  var R0 = Math.min(W, H) * 0.32;

  var nodes = characters.map(function (c, i) {
    var angle = (i / Math.max(n, 1)) * Math.PI * 2 - Math.PI / 2;
    return {
      id: c.id,
      title: c.title || '未命名',
      x: cx + R0 * Math.cos(angle),
      y: cy + R0 * Math.sin(angle),
      vx: 0, vy: 0
    };
  });
  var nodeById = new Map(nodes.map(function (nd) { return [nd.id, nd]; }));

  var layoutEdges = [];
  pairSet.forEach(function (pairKey) {
    var parts = pairKey.split('|');
    layoutEdges.push({ source: parts[0], target: parts[1] });
  });

  var iterations = n > 30 ? 160 : 320;
  var repulsion = n <= 3 ? 24000 : (n <= 8 ? 70000 : 120000);
  var springLength = Math.max(160, Math.min(240, 1200 / Math.max(n, 1)));
  var springK = 0.06;
  var damping = 0.82;
  var centerPull = 0.008;

  for (var it = 0; it < iterations; it++) {
    for (var i = 0; i < nodes.length; i++) {
      for (var j = i + 1; j < nodes.length; j++) {
        var a = nodes[i], b = nodes[j];
        var dx = b.x - a.x, dy = b.y - a.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < 1) d2 = 1;
        var d = Math.sqrt(d2);
        var f = repulsion / d2;
        var fx = (dx / d) * f;
        var fy = (dy / d) * f;
        a.vx -= fx; a.vy -= fy;
        b.vx += fx; b.vy += fy;
      }
    }
    layoutEdges.forEach(function (e) {
      var a = nodeById.get(e.source);
      var b = nodeById.get(e.target);
      if (!a || !b) return;
      var dx = b.x - a.x, dy = b.y - a.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      var f = (d - springLength) * springK;
      var fx = (dx / d) * f;
      var fy = (dy / d) * f;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    });
    nodes.forEach(function (nd) {
      nd.vx += (cx - nd.x) * centerPull;
      nd.vy += (cy - nd.y) * centerPull;
    });
    nodes.forEach(function (nd) {
      nd.vx *= damping;
      nd.vy *= damping;
      nd.x += nd.vx;
      nd.y += nd.vy;
      nd.x = Math.max(72, Math.min(W - 72, nd.x));
      nd.y = Math.max(48, Math.min(H - 58, nd.y));
    });
  }

  var positions = {};
  nodes.forEach(function (nd) { positions[nd.id] = { x: nd.x, y: nd.y }; });

  graphData = { W: W, H: H, positions: positions, edges: graphEdges };

  var edgesSvg = '';
  graphEdges.forEach(function (edge, idx) {
    var geo = computeEdgeGeometry(edge, positions);
    if (!geo) return;
    var arrowEnd = arrowPoints(geo.ex, geo.ey, geo.nx, geo.ny);
    var arrowStart = edge.type === 'bidirectional'
      ? arrowPoints(geo.sx, geo.sy, -geo.nx, -geo.ny) : '';
    var mx = ((geo.sx + geo.ex) / 2).toFixed(1);
    var my = ((geo.sy + geo.ey) / 2 - 6).toFixed(1);
    var label = edge.labels.join(' / ');

    edgesSvg += '<g class="graph-edge-group" data-idx="' + idx + '" data-source="' + edge.source + '" data-target="' + edge.target + '">' +
      '<line class="graph-edge-line" x1="' + geo.sx.toFixed(1) + '" y1="' + geo.sy.toFixed(1) + '" x2="' + geo.ex.toFixed(1) + '" y2="' + geo.ey.toFixed(1) + '"/>' +
      '<polygon class="graph-edge-arrow" points="' + arrowEnd + '"/>' +
      (arrowStart ? '<polygon class="graph-edge-arrow" points="' + arrowStart + '"/>' : '') +
      '<text class="graph-edge-label" x="' + mx + '" y="' + my + '">' + esc(label) + '</text>' +
    '</g>';
  });

  var nodesSvg = '';
  nodes.forEach(function (nd) {
    var initial = (nd.title || '?').charAt(0);
    var shortTitle = nd.title.length > 6 ? nd.title.slice(0, 6) + '…' : nd.title;
    nodesSvg += '<g class="graph-node" data-node-id="' + nd.id + '" transform="translate(' + nd.x.toFixed(1) + ',' + nd.y.toFixed(1) + ')">' +
      '<title>' + esc(nd.title) + '</title>' +
      '<circle r="26"/>' +
      '<text class="graph-node-initial" y="5">' + esc(initial) + '</text>' +
      '<text class="graph-node-label" y="44">' + esc(shortTitle) + '</text>' +
    '</g>';
  });

  var svg = '<svg class="graph-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
    '<g class="graph-edges">' + edgesSvg + '</g>' +
    '<g class="graph-nodes">' + nodesSvg + '</g>' +
  '</svg>';

  var pairs = getSymPairs(w);
  var legend = pairs.length
    ? '<div class="graph-legend">' +
        '<span class="graph-legend-title">对称关联（双箭头）：</span>' +
        pairs.map(function (p) {
          return '<span class="graph-legend-item">' + esc(p.a) + ' ↔ ' + esc(p.b) +
            (p.mutualName ? '（' + esc(p.mutualName) + '）' : '') + '</span>';
        }).join('') +
      '</div>'
    : '';

  return '<div class="panel-head">' +
    '<span class="panel-hint">' + characters.length + ' 个人物 · ' + graphEdges.length + ' 条关联 · 拖动节点调整位置 · 点击节点打开条目</span>' +
    '<button class="btn-primary" data-act="new-entry" data-type="character">+ 新建人物</button>' +
  '</div>' +
  '<div class="graph-wrap">' + svg + '</div>' + legend;
}

function computeEdgeGeometry(edge, positions) {
  var pairParts = edge.pairKey.split('|');
  var keyA = pairParts[0], keyB = pairParts[1];
  var a = positions[keyA];
  var b = positions[keyB];
  if (!a || !b) return null;

  var dx = b.x - a.x, dy = b.y - a.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 1) return null;

  var nx = dx / dist, ny = dy / dist;
  var px = -ny, py = nx;

  var SPACING = 22;
  var offset = (edge.offsetIndex - (edge.pairTotal - 1) / 2) * SPACING;
  var ox = px * offset, oy = py * offset;

  var sourcePos = positions[edge.source];
  var targetPos = positions[edge.target];
  if (!sourcePos || !targetPos) return null;

  var sCx = sourcePos.x + ox, sCy = sourcePos.y + oy;
  var tCx = targetPos.x + ox, tCy = targetPos.y + oy;

  var sdx = tCx - sCx, sdy = tCy - sCy;
  var sdist = Math.sqrt(sdx * sdx + sdy * sdy);
  if (sdist < 1) return null;

  var snx = sdx / sdist, sny = sdy / sdist;
  var R = 28;
  if (sdist < 2 * R + 6) return null;

  return {
    sx: sCx + snx * R, sy: sCy + sny * R,
    ex: tCx - snx * R, ey: tCy - sny * R,
    nx: snx, ny: sny
  };
}

function arrowPoints(tipX, tipY, dirX, dirY) {
  var size = 8, wing = 4;
  var baseX = tipX - dirX * size;
  var baseY = tipY - dirY * size;
  var wingX = -dirY, wingY = dirX;
  return tipX.toFixed(1) + ',' + tipY.toFixed(1) + ' ' +
    (baseX + wingX * wing).toFixed(1) + ',' + (baseY + wingY * wing).toFixed(1) + ' ' +
    (baseX - wingX * wing).toFixed(1) + ',' + (baseY - wingY * wing).toFixed(1);
}

function redrawEdgesForNode(nodeId) {
  var svg = document.querySelector('.graph-svg');
  if (!svg || !graphData) return;
  graphData.edges.forEach(function (edge, idx) {
    if (edge.source !== nodeId && edge.target !== nodeId) return;
    var g = svg.querySelector('.graph-edge-group[data-idx="' + idx + '"]');
    if (!g) return;
    var geo = computeEdgeGeometry(edge, graphData.positions);
    if (!geo) { g.style.display = 'none'; return; }
    g.style.display = '';
    var line = g.querySelector('.graph-edge-line');
    line.setAttribute('x1', geo.sx.toFixed(1));
    line.setAttribute('y1', geo.sy.toFixed(1));
    line.setAttribute('x2', geo.ex.toFixed(1));
    line.setAttribute('y2', geo.ey.toFixed(1));

    var arrows = g.querySelectorAll('.graph-edge-arrow');
    if (arrows[0]) arrows[0].setAttribute('points', arrowPoints(geo.ex, geo.ey, geo.nx, geo.ny));
    if (arrows[1]) arrows[1].setAttribute('points', arrowPoints(geo.sx, geo.sy, -geo.nx, -geo.ny));

    var label = g.querySelector('.graph-edge-label');
    label.setAttribute('x', ((geo.sx + geo.ex) / 2).toFixed(1));
    label.setAttribute('y', ((geo.sy + geo.ey) / 2 - 6).toFixed(1));
  });
}

/* ---------- 搜索 ---------- */
function renderSearch(w) {
  var q = state.search.trim();
  if (!q) return '';
  var ql = q.toLowerCase();

  var results = w.entries.filter(function (e) {
    var texts = [e.title, e.content, e.category, e.timeName, e.symA, e.symB, e.mutualName];
    (e.relations || []).forEach(function (r) {
      texts.push(r.label);
      var tgt = findEntry(w, r.targetId);
      if (tgt) texts.push(tgt.title);
    });
    if (e.eventId) {
      var ev = findEntry(w, e.eventId);
      if (ev) texts.push(ev.title);
    }
    return texts.map(function (v) { return String(v || '').toLowerCase(); }).join(' ').indexOf(ql) >= 0;
  });

  results.sort(function (a, b) {
    var ta = w.entryTypes.findIndex(function (t) { return t.id === a.typeId; });
    var tb = w.entryTypes.findIndex(function (t) { return t.id === b.typeId; });
    if (ta !== tb) return ta - tb;
    return COLLATOR.compare(a.title || '', b.title || '');
  });

  return '<div class="panel-head">' +
    '<span class="panel-hint">搜索「' + esc(q) + '」 · ' + results.length + ' 条结果</span>' +
    '<button class="btn-ghost" data-act="clearsearch">清除搜索</button>' +
  '</div>' +
  (results.length ? results.map(function (e) {
    var type = typeById(w, e.typeId);
    var meta = '';
    if (type.id === 'event') meta = e.timeName || fmtNum(e.absTime);
    else if (type.id === 'setting') meta = e.category || '';
    else if (type.id === 'story') {
      var ev = e.eventId ? findEntry(w, e.eventId) : null;
      meta = ev ? ev.title : '未关联事件';
    } else if (type.special === 'symPair') {
      meta = (e.symA || '?') + ' ↔ ' + (e.symB || '?') + (e.mutualName ? '（' + e.mutualName + '）' : '');
    }
    return '<div class="card clickable" data-act="open-entry" data-id="' + e.id + '">' +
      '<div class="card-head">' +
        '<span class="tag type" style="background:' + typeColorLight(type.id) + ';color:' + typeColor(type.id) + '">' + esc(type.name) + '</span>' +
        (meta ? '<span class="tag">' + esc(meta) + '</span>' : '') +
        '<span class="card-title">' + esc(e.title) + '</span>' +
      '</div>' +
      (e.content ? '<div class="card-text">' + esc(e.content.length > 110 ? e.content.slice(0, 110) + '…' : e.content) + '</div>' : '') +
    '</div>';
  }).join('') : '<div class="empty">没有匹配的条目。</div>');
}

/* =========================================================
   关系图交互
   ========================================================= */
function initGraphInteraction() {
  var svg = document.querySelector('.graph-svg');
  if (!svg) return;

  svg.addEventListener('mouseover', function (e) {
    var g = e.target.closest ? e.target.closest('.graph-node') : null;
    if (!g) return;
    var id = g.getAttribute('data-node-id');
    svg.querySelectorAll('.graph-edge-group').forEach(function (eg) {
      var on = eg.getAttribute('data-source') === id || eg.getAttribute('data-target') === id;
      if (on) eg.classList.add('highlight'); else eg.classList.remove('highlight');
    });
  });

  svg.addEventListener('mouseout', function (e) {
    var g = e.target.closest ? e.target.closest('.graph-node') : null;
    if (!g) return;
    svg.querySelectorAll('.graph-edge-group.highlight').forEach(function (eg) {
      eg.classList.remove('highlight');
    });
  });

  function getPointerSvgPoint(clientX, clientY) {
    var rect = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    if (!vb || !vb.width) return { x: clientX, y: clientY };
    return {
      x: ((clientX - rect.left) / rect.width) * vb.width,
      y: ((clientY - rect.top) / rect.height) * vb.height
    };
  }

  function startDrag(g, clientX, clientY) {
    var id = g.getAttribute('data-node-id');
    var m = /translate\(([-\d.]+),([-\d.]+)\)/.exec(g.getAttribute('transform') || '');
    if (!m) return null;
    var pt = getPointerSvgPoint(clientX, clientY);
    return {
      id: id, g: g,
      offsetX: parseFloat(m[1]) - pt.x,
      offsetY: parseFloat(m[2]) - pt.y,
      startClientX: clientX, startClientY: clientY,
      moved: false
    };
  }

  function moveDrag(clientX, clientY) {
    if (!graphDrag) return;
    var dx = clientX - graphDrag.startClientX;
    var dy = clientY - graphDrag.startClientY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) graphDrag.moved = true;

    var pt = getPointerSvgPoint(clientX, clientY);
    var vb = svg.viewBox.baseVal;
    var newX = Math.max(72, Math.min(vb.width - 72, pt.x + graphDrag.offsetX));
    var newY = Math.max(48, Math.min(vb.height - 58, pt.y + graphDrag.offsetY));

    graphDrag.g.setAttribute('transform', 'translate(' + newX.toFixed(1) + ',' + newY.toFixed(1) + ')');
    if (graphData) {
      graphData.positions[graphDrag.id] = { x: newX, y: newY };
      redrawEdgesForNode(graphDrag.id);
    }
  }

  function endDrag() {
    if (!graphDrag) return;
    var moved = graphDrag.moved;
    var id = graphDrag.id;
    graphDrag = null;
    if (!moved) openEntryEditor(null, id);
  }

  if (window.PointerEvent) {
    svg.addEventListener('pointerdown', function (e) {
      var g = e.target.closest ? e.target.closest('.graph-node') : null;
      if (!g) return;
      graphDrag = startDrag(g, e.clientX, e.clientY);
      if (!graphDrag) return;
      try { g.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    svg.addEventListener('pointermove', function (e) {
      if (!graphDrag) return;
      moveDrag(e.clientX, e.clientY);
      e.preventDefault();
    });
    svg.addEventListener('pointerup', function () { endDrag(); });
    svg.addEventListener('pointercancel', function () { graphDrag = null; });
  } else {
    svg.addEventListener('mousedown', function (e) {
      var g = e.target.closest ? e.target.closest('.graph-node') : null;
      if (!g) return;
      graphDrag = startDrag(g, e.clientX, e.clientY);
      if (graphDrag) e.preventDefault();
    });
    window.addEventListener('mousemove', function (e) {
      if (!graphDrag) return;
      moveDrag(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', function () { endDrag(); });
  }
}
