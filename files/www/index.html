/* =========================================================
   通用弹窗
   ========================================================= */
function fieldHTML(f) {
  var attrs = 'name="' + f.key + '" placeholder="' + esc(f.placeholder || '') + '"';
  var control;
  if (f.type === 'select') {
    control = '<select name="' + f.key + '">' + (f.options || []).map(function (o) {
      var sel = String(o.value) === String(f.value == null ? '' : f.value) ? 'selected' : '';
      return '<option value="' + esc(o.value) + '" ' + sel + '>' + esc(o.label) + '</option>';
    }).join('') + '</select>';
  } else if (f.type === 'textarea') {
    control = '<textarea ' + attrs + ' rows="' + (f.rows || 5) + '">' + esc(f.value || '') + '</textarea>';
  } else {
    control = '<input type="text" ' + attrs + ' value="' + esc(f.value || '') + '">';
  }
  return '<label class="field">' +
    '<span class="field-label">' + esc(f.label) + '</span>' +
    control +
    (f.hint ? '<span class="field-hint">' + esc(f.hint) + '</span>' : '') +
  '</label>';
}

function openEditor(opts) {
  var overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
    '<div class="modal-title">' + esc(opts.title) + '</div>' +
    '<form class="modal-form" novalidate>' +
      opts.fields.map(fieldHTML).join('') +
      '<div class="modal-actions">' +
        '<button type="button" class="btn-ghost" data-close>取消</button>' +
        '<button type="submit" class="btn-primary">保存</button>' +
      '</div>' +
    '</form>' +
  '</div>';
  document.body.appendChild(overlay);

  var onKey = function (ev) { if (ev.key === 'Escape') close(); };
  function close() {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
  }
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('mousedown', function (ev) { if (ev.target === overlay) close(); });
  overlay.querySelector('[data-close]').addEventListener('click', close);

  var form = overlay.querySelector('form');
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var data = {};
    opts.fields.forEach(function (f) {
      var el = form.elements[f.key];
      data[f.key] = el ? el.value.trim() : '';
    });
    if (opts.onSubmit(data) !== false) close();
  });
  var first = overlay.querySelector('input, textarea, select');
  if (first) setTimeout(function () { first.focus(); }, 20);
}

/* =========================================================
   图片压缩
   ========================================================= */
function compressImage(file, maxSize, quality) {
  if (!maxSize) maxSize = ELECTRON ? 1200 : 900;
  if (!quality) quality = ELECTRON ? 0.85 : 0.75;
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var width = img.width, height = img.height;
        if (width > maxSize || height > maxSize) {
          if (width > height) {
            height = Math.round(height * maxSize / width);
            width = maxSize;
          } else {
            width = Math.round(width * maxSize / height);
            height = maxSize;
          }
        }
        var canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   条目编辑器
   ========================================================= */
function buildTypeSpecificFields(w, typeId, vals) {
  var type = w.entryTypes.find(function (t) { return t.id === typeId; });
  if (!type) return [];

  if (type.special === 'symPair') {
    return [
      { key: 'symA', label: '关联名 A', type: 'text', value: vals.symA || '', placeholder: '例如：丈夫' },
      { key: 'symB', label: '关联名 B', type: 'text', value: vals.symB || '', placeholder: '例如：妻子',
        hint: 'A 和 B 互为反向。' },
      { key: 'mutualName', label: '相互称呼（可选）', type: 'text', value: vals.mutualName || '',
        placeholder: '例如：夫妻',
        hint: '关系图中若双向关联匹配，将合并为一条双箭头线并显示此称呼。' }
    ];
  }

  if (typeId === 'event') {
    return [
      { key: 'absTime', label: '绝对时间（数字，用于排序）', type: 'text',
        value: vals.absTime !== undefined ? fmtNum(vals.absTime) : '', placeholder: '例如：0、137、402.5、-20',
        hint: '只能填数字。时间轴按此值从小到大排列。' },
      { key: 'timeName', label: '命名时间（显示在圆点上方）', type: 'text',
        value: vals.timeName || '', placeholder: '例如：第三纪元 402 年' }
    ];
  }

  if (typeId === 'setting') {
    return [
      { key: 'category', label: '分类', type: 'text', value: vals.category || '',
        placeholder: '地理 / 历史 / 势力 / 种族 / 规则…' }
    ];
  }

  if (typeId === 'story') {
    var evs = sortedEvents(w);
    var options = [{ value: '', label: '—— 不关联事件 ——' }].concat(evs.map(function (e) {
      return { value: e.id, label: (e.timeName || fmtNum(e.absTime)) + ' · ' + e.title };
    }));
    return [
      { key: 'eventId', label: '关联事件', type: 'select', options: options, value: vals.eventId || '',
        hint: '故事会显示在时间线上对应事件卡片的下方。' }
    ];
  }

  return [];
}

function openEntryEditor(typeId, id, opts) {
  opts = opts || {};
  var w = currentWorld();
  if (!w) return;

  var isNew = !id;
  var entry = isNew ? null : findEntry(w, id);
  var initType = typeId || (entry ? entry.typeId : 'setting');
  var initVals = entry ? JSON.parse(JSON.stringify(entry)) : {
    title: '', content: '', image: null, relations: [],
    absTime: opts.abs !== undefined ? opts.abs : suggestNextAbs(w),
    timeName: opts.name || '',
    eventId: opts.presetEventId || '',
    category: '',
    symA: '', symB: '', mutualName: ''
  };
  if (opts.abs !== undefined) initVals.absTime = opts.abs;
  if (opts.name) initVals.timeName = opts.name;
  if (opts.presetEventId) initVals.eventId = opts.presetEventId;

  var workRelations = JSON.parse(JSON.stringify(initVals.relations || []));
  var workImage = initVals.image || null;
  var originalImage = initVals.image || null;
  var currentTypeId = initType;

  var overlay = document.createElement('div');
  overlay.className = 'overlay';

  function fieldsHTMLForType(tid) {
    var specific = buildTypeSpecificFields(w, tid, initVals);
    var basic = [
      { key: 'title', label: '标题', type: 'text', value: initVals.title || '', placeholder: '条目标题' },
      { key: 'content', label: '内容', type: 'textarea', rows: 7, value: initVals.content || '', placeholder: '详细描述…' }
    ];
    return specific.concat(basic);
  }

  function typeSelectHTML() {
    if (!isNew) {
      var t = typeById(w, currentTypeId);
      return '<div class="field">' +
        '<span class="field-label">类型</span>' +
        '<div style="font-size:13px;padding:8px 0">' + esc(t.name) + '（编辑时不可更改类型）</div>' +
      '</div>';
    }
    return '<div class="field">' +
      '<span class="field-label">条目类型</span>' +
      '<select id="typeSelect">' +
        w.entryTypes.map(function (t) {
          return '<option value="' + esc(t.id) + '" ' + (t.id === currentTypeId ? 'selected' : '') + '>' + esc(t.name) + '</option>';
        }).join('') +
        '<option value="__custom__">+ 自定义新类型…</option>' +
      '</select>' +
      '<input type="text" id="customTypeInput" placeholder="输入新类型名称…" style="margin-top:8px;display:none">' +
    '</div>';
  }

  overlay.innerHTML = '<div class="modal modal-wide" role="dialog" aria-modal="true">' +
    '<div class="modal-title">' + (isNew ? '新建条目' : '编辑条目') + '</div>' +
    '<div class="editor-body">' +
      '<div class="editor-form">' +
        '<form class="modal-form" id="entryForm" novalidate>' +
          typeSelectHTML() +
          '<div id="typeSpecificFields">' + fieldsHTMLForType(currentTypeId).map(fieldHTML).join('') + '</div>' +
          '<div class="field">' +
            '<span class="field-label">图片</span>' +
            '<div class="img-upload">' +
              '<img id="imgPreview" class="img-preview ' + (workImage ? 'show' : '') + '" src="' + esc(resolveImage(workImage)) + '" alt="">' +
              '<div class="img-actions">' +
                '<label for="imgFileInput">选择图片</label>' +
                '<input type="file" id="imgFileInput" accept="image/*">' +
                '<button type="button" id="imgRemoveBtn" style="display:' + (workImage ? 'inline-block' : 'none') + '">移除图片</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</form>' +
      '</div>' +
      '<div class="editor-rel">' +
        '<div class="rel-title">关联</div>' +
        '<div class="rel-list" id="relList"></div>' +
        '<div class="rel-add" id="relAdd" style="display:none">' +
          '<input type="text" id="relLabelInput" placeholder="关联名，如：原材料" list="relLabelList">' +
          '<datalist id="relLabelList"></datalist>' +
          '<select id="relTargetSelect"></select>' +
          '<div class="rel-add-actions">' +
            '<button type="button" class="btn-ghost" id="relCancel">取消</button>' +
            '<button type="button" class="btn-primary" id="relConfirm">确定</button>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="btn-ghost full-width" id="btnAddRel">+ 添加关联</button>' +
        '<div class="rel-help">在「关联名」填写对称关联中的名称，保存后对方条目会自动获得反向关联。</div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-actions">' +
      '<button type="button" class="btn-ghost" data-close>取消</button>' +
      '<button type="button" class="btn-primary" id="saveEntryBtn">保存</button>' +
    '</div>' +
  '</div>';

  document.body.appendChild(overlay);

  var typeSelect = overlay.querySelector('#typeSelect');
  var customTypeInput = overlay.querySelector('#customTypeInput');
  var typeFields = overlay.querySelector('#typeSpecificFields');

  function rerenderTypeFields() {
    typeFields.innerHTML = fieldsHTMLForType(currentTypeId).map(fieldHTML).join('');
  }

  if (typeSelect) {
    typeSelect.addEventListener('change', function () {
      var v = typeSelect.value;
      if (v === '__custom__') {
        customTypeInput.style.display = 'block';
        customTypeInput.focus();
      } else {
        customTypeInput.style.display = 'none';
        currentTypeId = v;
        rerenderTypeFields();
      }
    });
  }

  var imgPreview = overlay.querySelector('#imgPreview');
  var imgFileInput = overlay.querySelector('#imgFileInput');
  var imgRemoveBtn = overlay.querySelector('#imgRemoveBtn');

  imgFileInput.addEventListener('change', function () {
    var f = imgFileInput.files && imgFileInput.files[0];
    if (!f) return;
    compressImage(f).then(function (dataUrl) {
      return saveImageToStore(dataUrl);
    }).then(function (stored) {
      workImage = stored;
      imgPreview.src = resolveImage(stored);
      imgPreview.classList.add('show');
      imgRemoveBtn.style.display = 'inline-block';
      imgFileInput.value = '';
    }).catch(function (err) {
      alert('图片保存失败：' + (err && err.message ? err.message : err));
      imgFileInput.value = '';
    });
  });

  imgRemoveBtn.addEventListener('click', function () {
    workImage = null;
    imgPreview.src = '';
    imgPreview.classList.remove('show');
    imgRemoveBtn.style.display = 'none';
  });

  var relListEl = overlay.querySelector('#relList');
  var relAdd = overlay.querySelector('#relAdd');
  var btnAddRel = overlay.querySelector('#btnAddRel');

  function refreshRelList() {
    if (!workRelations.length) {
      relListEl.innerHTML = '<div class="rel-empty">还没有关联</div>';
      return;
    }
    var groups = new Map();
    workRelations.forEach(function (r) {
      var tgt = findEntry(w, r.targetId);
      var tid = tgt ? tgt.typeId : '__unknown';
      if (!groups.has(tid)) groups.set(tid, []);
      groups.get(tid).push({ r: r, tgt: tgt });
    });

    var html = '';
    var orderedTypes = w.entryTypes.map(function (t) { return t.id; }).concat(['__unknown']);
    orderedTypes.forEach(function (tid) {
      var list = groups.get(tid);
      if (!list || !list.length) return;
      var t = typeById(w, tid);
      html += '<div class="rel-group">' +
        '<div class="rel-group-head">' + esc(tid === '__unknown' ? '未知类型' : t.name) + '</div>' +
        list.map(function (item) {
          var tgt = item.tgt, r = item.r;
          return '<div class="rel-item">' +
            '<span class="rel-label">' + esc(r.label) + '：</span>' +
            '<span class="rel-target" title="' + esc(tgt ? tgt.title : '') + '">' + esc(tgt ? tgt.title : '(已删除)') + '</span>' +
            '<button type="button" class="rel-del" data-rid="' + r.id + '">×</button>' +
          '</div>';
        }).join('') +
      '</div>';
    });
    relListEl.innerHTML = html;
  }

  function refreshTargetSelect() {
    var sel = overlay.querySelector('#relTargetSelect');
    var html = '<option value="">选择关联对象…</option>';
    w.entryTypes.forEach(function (t) {
      var opts2 = w.entries
        .filter(function (e) { return e.typeId === t.id && e.id !== (entry ? entry.id : '__new__'); })
        .map(function (e) { return '<option value="' + e.id + '">' + esc(e.title || '(无标题)') + '</option>'; });
      if (opts2.length) html += '<optgroup label="' + esc(t.name) + '">' + opts2.join('') + '</optgroup>';
    });
    sel.innerHTML = html;
  }

  function refreshLabelSuggest() {
    var dl = overlay.querySelector('#relLabelList');
    var names = {};
    getSymPairs(w).forEach(function (p) { names[p.a] = 1; names[p.b] = 1; });
    workRelations.forEach(function (r) { names[r.label] = 1; });
    dl.innerHTML = Object.keys(names).map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join('');
  }

  refreshRelList();
  refreshTargetSelect();
  refreshLabelSuggest();

  btnAddRel.addEventListener('click', function () {
    relAdd.style.display = 'flex';
    btnAddRel.style.display = 'none';
    overlay.querySelector('#relLabelInput').focus();
  });
  overlay.querySelector('#relCancel').addEventListener('click', function () {
    relAdd.style.display = 'none';
    btnAddRel.style.display = '';
    overlay.querySelector('#relLabelInput').value = '';
    overlay.querySelector('#relTargetSelect').value = '';
  });
  overlay.querySelector('#relConfirm').addEventListener('click', function () {
    var label = overlay.querySelector('#relLabelInput').value.trim();
    var targetId = overlay.querySelector('#relTargetSelect').value;
    if (!label) { alert('请填写关联名'); return; }
    if (!targetId) { alert('请选择关联对象'); return; }
    if (workRelations.some(function (r) { return r.label === label && r.targetId === targetId; })) {
      alert('已存在相同的关联');
      return;
    }
    workRelations.push({ id: uid(), label: label, targetId: targetId });
    refreshRelList();
    refreshLabelSuggest();
    relAdd.style.display = 'none';
    btnAddRel.style.display = '';
    overlay.querySelector('#relLabelInput').value = '';
    overlay.querySelector('#relTargetSelect').value = '';
  });

  relListEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.rel-del');
    if (!btn) return;
    var rid = btn.getAttribute('data-rid');
    workRelations = workRelations.filter(function (r) { return r.id !== rid; });
    refreshRelList();
  });

  var onKey = function (ev) { if (ev.key === 'Escape') close(); };
  function close() {
    if (workImage && workImage !== originalImage && workImage.indexOf('data:') !== 0) {
      deleteImageFromStore(workImage);
    }
    overlay.remove();
    document.removeEventListener('keydown', onKey);
  }
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('mousedown', function (ev) { if (ev.target === overlay) close(); });
  overlay.querySelector('[data-close]').addEventListener('click', close);

  var form = overlay.querySelector('#entryForm');

  function doSave() {
    var data = {};
    var allInputs = form.querySelectorAll('input[name], textarea[name], select[name]');
    allInputs.forEach(function (el) { data[el.name] = (el.value || '').trim(); });

    var saveTypeId = currentTypeId;
    if (isNew && typeSelect) {
      var v = typeSelect.value;
      if (v === '__custom__') {
        var newName = customTypeInput.value.trim();
        if (!newName) { alert('请输入自定义类型名称'); return; }
        var existing = w.entryTypes.find(function (t) { return t.name === newName; });
        if (existing) {
          saveTypeId = existing.id;
        } else {
          var newId = 'custom_' + uid();
          w.entryTypes.push({ id: newId, name: newName });
          saveTypeId = newId;
        }
      } else {
        saveTypeId = v;
      }
    }

    var type = typeById(w, saveTypeId);

    if (type.special === 'symPair') {
      data.symA = (data.symA || '').trim();
      data.symB = (data.symB || '').trim();
      data.mutualName = (data.mutualName || '').trim();
      if (!data.symA || !data.symB) { alert('两个关联名都要填写'); return; }
      if (data.symA === data.symB) { alert('两个关联名不能相同'); return; }
      data.title = data.symA + ' ↔ ' + data.symB;
    } else {
      if (!data.title) { alert('标题不能为空'); return; }
    }

    if (saveTypeId === 'event') {
      var n = parseAbs(data.absTime);
      if (n === null) { alert('绝对时间必须填写，且必须是数字。'); return; }
      data.absTime = n;
    }
    if (saveTypeId === 'story') {
      data.eventId = data.eventId || null;
    }

    data.image = workImage || null;

    if (isNew) {
      var newEntry = {
        id: uid(), typeId: saveTypeId,
        title: data.title || '',
        content: data.content || '',
        category: data.category || '',
        timeName: data.timeName || '',
        absTime: data.absTime !== undefined ? data.absTime : undefined,
        order: 0,
        eventId: data.eventId || null,
        symA: data.symA || '',
        symB: data.symB || '',
        mutualName: data.mutualName || '',
        image: data.image,
        relations: []
      };
      if (saveTypeId === 'event') {
        var same = w.entries.filter(function (e) { return e.typeId === 'event' && e.absTime === newEntry.absTime; });
        newEntry.order = same.length ? Math.max.apply(null, same.map(function (x) { return x.order || 0; })) + 1 : 0;
      }
      w.entries.push(newEntry);
      workRelations.forEach(function (r) { addRelation(w, newEntry, r.label, r.targetId, r.id); });
    } else {
      var oldAbs = entry.absTime;
      var oldRelations = JSON.parse(JSON.stringify(entry.relations || []));
      var oldImage = entry.image;

      Object.assign(entry, data);
      entry.typeId = currentTypeId;

      if (oldImage && oldImage !== data.image) {
        deleteImageFromStore(oldImage);
      }

      if (currentTypeId === 'event' && entry.absTime !== oldAbs) {
        var same2 = w.entries.filter(function (e) {
          return e.typeId === 'event' && e.id !== entry.id && e.absTime === entry.absTime;
        });
        entry.order = same2.length ? Math.max.apply(null, same2.map(function (x) { return x.order || 0; })) + 1 : 0;
      }
      applyRelations(w, entry, oldRelations, workRelations);
    }

    normalizeEventOrders(w);
    save();
    overlay.remove();
    document.removeEventListener('keydown', onKey);
    if (state.activeTab === 'timeline') renderKeepScroll();
    else render();
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); doSave(); });
  overlay.querySelector('#saveEntryBtn').addEventListener('click', doSave);

  var firstInput = overlay.querySelector('#entryForm input, #entryForm textarea, #entryForm select');
  if (firstInput) setTimeout(function () { firstInput.focus(); }, 20);
}

function parseAbs(raw) {
  var t = String(raw || '').trim();
  if (!t) return null;
  var n = Number(t);
  return Number.isFinite(n) ? n : null;
}

/* =========================================================
   删除条目
   ========================================================= */
function deleteEntry(id) {
  var w = currentWorld();
  if (!w) return;
  var e = findEntry(w, id);
  if (!e) return;

  if (e.typeId === 'event') {
    w.entries.forEach(function (s) { if (s.typeId === 'story' && s.eventId === id) s.eventId = null; });
  }
  if (e.image) deleteImageFromStore(e.image);
  cleanupRelations(w, id);
  w.entries = w.entries.filter(function (x) { return x.id !== id; });
  normalizeEventOrders(w);
  save();
  if (state.activeTab === 'timeline') renderKeepScroll();
  else render();
}

function moveInGroup(id, dir) {
  var w = currentWorld();
  if (!w) return;
  normalizeEventOrders(w);
  var e = findEntry(w, id);
  if (!e || e.typeId !== 'event') return;
  var group = w.entries
    .filter(function (x) { return x.typeId === 'event' && x.absTime === e.absTime; })
    .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  var idx = group.indexOf(e);
  var ni = idx + dir;
  if (idx < 0 || ni < 0 || ni >= group.length) return;
  var tmp = group[idx]; group[idx] = group[ni]; group[ni] = tmp;
  group.forEach(function (x, i) { x.order = i; });
  save(); renderKeepScroll();
}

/* =========================================================
   世界
   ========================================================= */
function newWorld() {
  openEditor({
    title: '新建世界',
    fields: [
      { key: 'name', label: '世界名称', type: 'text', placeholder: '例如：霜落大陆' },
      { key: 'desc', label: '简介', type: 'textarea', rows: 3, placeholder: '一句话描述这个世界…' }
    ],
    onSubmit: function (d) {
      var w = makeWorld(d.name || '未命名世界', d.desc);
      state.worlds.push(w);
      state.activeWorldId = w.id;
      state.activeTab = 'entries';
      state.search = '';
      save(); render();
    }
  });
}

function editWorld(w) {
  openEditor({
    title: '编辑世界',
    fields: [
      { key: 'name', label: '世界名称', type: 'text', value: w.name },
      { key: 'desc', label: '简介', type: 'textarea', rows: 3, value: w.desc }
    ],
    onSubmit: function (d) {
      w.name = d.name || '未命名世界';
      w.desc = d.desc;
      save(); render();
    }
  });
}

function deleteWorld(w) {
  if (!confirm('确定删除世界「' + w.name + '」？其中的全部条目都会丢失。')) return;
  w.entries.forEach(function (e) { if (e.image) deleteImageFromStore(e.image); });
  state.worlds = state.worlds.filter(function (x) { return x.id !== w.id; });
  state.activeWorldId = state.worlds[0] ? state.worlds[0].id : null;
  state.search = '';
  save(); render();
}

/* =========================================================
   导入 / 导出
   ========================================================= */
function exportBackup(includeImages) {
  var payload = { worlds: state.worlds, activeWorldId: state.activeWorldId };

  if (includeImages && ELECTRON) {
    payload = JSON.parse(JSON.stringify(payload));
    payload.worlds.forEach(function (w) {
      w.entries.forEach(function (e) {
        if (e.image && e.image.indexOf('data:') !== 0) {
          var b64 = window.wbStore.readImage(e.image);
          if (b64) e.image = b64;
        }
      });
    });
  }

  var str = JSON.stringify(payload, null, 2);
  var blob = new Blob([str], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var date = new Date().toISOString().slice(0, 10);
  a.download = 'worldbuilder-' + (includeImages ? 'full-' : '') + date + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function importBackup(file) {
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.worlds)) throw new Error('文件格式不正确');
      if (!confirm('导入将替换当前全部数据，确定继续？')) return;

      if (ELECTRON) {
        d.worlds.forEach(function (w) {
          (w.entries || []).forEach(function (e) {
            if (e.image && e.image.indexOf('data:') === 0) {
              var res = window.wbStore.saveImage(e.image);
              if (res.ok) e.image = res.path;
            }
          });
        });
      }

      state.worlds = d.worlds;
      state.activeWorldId = d.activeWorldId || (d.worlds[0] ? d.worlds[0].id : null);
      state.worlds.forEach(migrateWorld);
      state.search = '';
      save(); render();
      alert('导入成功');
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   更新逻辑
   ========================================================= */
var UPDATE_MANIFEST_URL = 'https://Cychiakqy.github.io/cychiakqyeworldbuilder/updates.json';

function initUpdateUI() {
  if (!ELECTRON) return;

  var ub = document.getElementById('checkUpdateBtn');
  var oab = document.getElementById('openAppDirBtn');

  if (oab) {
    oab.style.display = '';
    oab.addEventListener('click', function () {
      try { window.wbStore.openAppDir(); } catch (e) { alert(e.message); }
    });
  }

  if (!ub) return;
  ub.style.display = '';
  ub.addEventListener('click', function () {
    if (UPDATE_MANIFEST_URL.indexOf('http') !== 0) {
      alert('请先在 index.html 中把 UPDATE_MANIFEST_URL 改成你的服务器地址。');
      return;
    }
    var oldText = ub.textContent;
    ub.textContent = '检查中…';
    ub.disabled = true;

    window.wbStore.checkUpdate(UPDATE_MANIFEST_URL).then(function (info) {
      if (!info.ok) {
        ub.textContent = oldText;
        ub.disabled = false;
        alert('检查失败：' + info.error);
        return;
      }
      if (!info.hasUpdate) {
        ub.textContent = oldText;
        ub.disabled = false;
        alert('已是最新版本（' + info.current + '）');
        return;
      }
      var msg = '发现新版本 ' + info.latest + '（当前 ' + info.current + '）';
      if (info.manifest.notes) msg += '\n\n更新内容：\n' + info.manifest.notes;
      msg += '\n\n下载完成后应用会自动重启。继续？';
      if (!confirm(msg)) {
        ub.textContent = oldText;
        ub.disabled = false;
        return;
      }
      ub.textContent = '下载中…';
      return window.wbStore.applyUpdate(UPDATE_MANIFEST_URL).then(function (res) {
        if (!res.ok) {
          ub.textContent = oldText;
          ub.disabled = false;
          alert('下载失败：' + res.error);
          return;
        }
        ub.textContent = '即将重启…';
        setTimeout(function () {
          window.wbStore.restartWithUpdate().then(function (r) {
            if (!r.ok) {
              ub.textContent = oldText;
              ub.disabled = false;
              alert('应用失败：' + r.error);
            }
          });
        }, 500);
      });
    }).catch(function (e) {
      ub.textContent = oldText;
      ub.disabled = false;
      alert('出错：' + e.message);
    });
  });
}

/* =========================================================
   事件绑定
   ========================================================= */
$('#worldList').addEventListener('click', function (e) {
  var item = e.target.closest('[data-world]');
  if (!item) return;
  state.activeWorldId = item.getAttribute('data-world');
  state.search = '';
  save(); render();
});

$('#newWorldBtn').addEventListener('click', newWorld);

$('#exportBtn').addEventListener('click', function () {
  var includeImages = false;
  if (ELECTRON) {
    includeImages = confirm('是否将图片一并写入备份文件？\n\n· 确定：含图片，文件较大，换电脑也能完整恢复\n· 取消：仅数据，图片路径保留，仅在当前电脑有效');
  }
  exportBackup(includeImages);
});

$('#importBtn').addEventListener('click', function () {
  $('#importFile').click();
});

$('#importFile').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0];
  if (f) importBackup(f);
  e.target.value = '';
});

var mainEl = $('#main');

mainEl.addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  var act = btn.getAttribute('data-act');
  var tab = btn.getAttribute('data-tab');
  var id = btn.getAttribute('data-id');
  var dir = btn.getAttribute('data-dir');
  var abs = btn.getAttribute('data-abs');
  var name = btn.getAttribute('data-name');
  var event = btn.getAttribute('data-event');
  var type = btn.getAttribute('data-type');

  if (act === 'newworld') { newWorld(); return; }
  if (act === 'tab') { state.activeTab = tab; state.search = ''; renderMain(); return; }
  if (act === 'clearsearch') { state.search = ''; renderMain(); return; }

  if (act === 'scroll') {
    var wrap = document.querySelector('.timeline-wrap');
    if (wrap) wrap.scrollBy({ left: Number(dir) * 420, behavior: 'smooth' });
    return;
  }

  var w = currentWorld();
  if (!w) return;

  if (act === 'editworld') { editWorld(w); return; }
  if (act === 'delworld') { deleteWorld(w); return; }

  if (act === 'new-entry') { openEntryEditor(type || 'setting', null); return; }
  if (act === 'new-event') { openEntryEditor('event', null, { abs: abs }); return; }
  if (act === 'new-same') { openEntryEditor('event', null, { abs: abs, name: name }); return; }
  if (act === 'new-story') { openEntryEditor('story', null, { presetEventId: event }); return; }

  if (act === 'open-entry') { openEntryEditor(null, id); return; }
  if (act === 'del-entry') { showDeleteConfirm(btn, id); return; }

  if (act === 'up-event') { moveInGroup(id, -1); return; }
  if (act === 'down-event') { moveInGroup(id, 1); return; }
});

mainEl.addEventListener('click', function (e) {
  var card = e.target.closest('.entry-card[data-act="open-entry"], .card.clickable[data-act="open-entry"]');
  if (!card) return;
  if (e.target.closest('button')) return;
  if (card.classList.contains('pending-del')) return;
  openEntryEditor(null, card.getAttribute('data-id'));
});

var isComposing = false;

mainEl.addEventListener('compositionstart', function (e) {
  if (e.target.id === 'searchInput') isComposing = true;
});

mainEl.addEventListener('compositionend', function (e) {
  if (e.target.id !== 'searchInput') return;
  isComposing = false;
  state.search = e.target.value;
  updateContentOnly();
});

mainEl.addEventListener('input', function (e) {
  if (e.target.id !== 'searchInput') return;
  if (isComposing) return;
  state.search = e.target.value;
  updateContentOnly();
});

mainEl.addEventListener('scroll', updateScrollBtns, true);

mainEl.addEventListener('wheel', function (e) {
  var wrap = e.target.closest && e.target.closest('.timeline-wrap');
  if (!wrap) return;
  if (wrap.scrollWidth <= wrap.clientWidth) return;
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    wrap.scrollLeft += e.deltaY;
    e.preventDefault();
  }
}, { passive: false });

window.addEventListener('resize', updateScrollBtns);

document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    var si = document.getElementById('searchInput');
    if (si) si.focus();
  }
});

/* =========================================================
   启动
   ========================================================= */
try {
  load();
  render();
  initUpdateUI();
} catch (err) {
  console.error(err);
  if (window.__wbShowError) window.__wbShowError(err && err.message ? err.message : String(err));
}
</script>
